name: Release

# 发版流程（add-on 版）。
#
# 与 hacs-vision（HACS integration）的关键差异：
#   - 版本号读 config.yaml 的 version，不是 custom_components/*/manifest.json
#   - **不打包 zip 资产**：add-on 的安装单元是整个仓库，Supervisor 直接拉代码/
#     镜像，不会去下载 Release 上的 zip。zip 步骤在这里是死代码。
#
# 保留 hacs-vision 用 v7.0.0 换来的两条教训：
#   1. GitHub 对草稿 Release 不创建 tag（只给 untagged-<hash> 占位 URL）。
#      tag 不存在 → 发布后依然没 tag → 用户收不到更新。必须先建 tag。
#   2. 判断 tag 是否存在必须查 git ls-remote，不能看 Release 的 URL。
on:
  push:
    branches: [main, master]
    paths:
      - 'config.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 读版本、与最新 tag 做 semver 比较（严格大于才发版）
      - name: Version check
        id: check
        run: |
          set -euo pipefail
          NEW_VERSION="$(python3 .github/scripts/read_addon_version.py config.yaml)"
          if [ -z "$NEW_VERSION" ]; then
            echo "::error::cannot read version from config.yaml"
            exit 1
          fi

          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          [ -z "$LATEST_TAG" ] && LATEST_TAG="v0.0.0"
          OLD_VERSION=${LATEST_TAG#v}

          echo "new=$NEW_VERSION old=$OLD_VERSION"

          python3 -m pip install --quiet packaging

          # add-on 版本常带 b13 / beta 这类后缀（非标准 PEP440 版次），
          # packaging 能解析 1.1.0b13；解析失败则视为非法版本，直接失败。
          IS_INCREASED=$(python3 -c "
          from packaging import version
          try:
              print(version.parse('$NEW_VERSION') > version.parse('$OLD_VERSION'))
          except Exception as e:
              print('PARSE_ERROR', e); raise SystemExit(1)
          ")

          if [ "$IS_INCREASED" = "True" ]; then
            echo "compare_result=success" >> $GITHUB_OUTPUT
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            if [[ "$NEW_VERSION" == *beta* || "$NEW_VERSION" == *rc* || "$NEW_VERSION" == *alpha* || "$NEW_VERSION" == *b[0-9]* ]]; then
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "compare_result=skip" >> $GITHUB_OUTPUT
            echo "::notice::新版本 $NEW_VERSION 不大于 $OLD_VERSION，跳过发布"
          fi

      # tag 必须先建：草稿 Release 不会创建 tag
      - name: Create and push tag
        if: steps.check.outputs.compare_result == 'success'
        run: |
          set -euo pipefail
          TAG="v${{ steps.check.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi

      - name: Create draft release
        if: steps.check.outputs.compare_result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
          IS_PRERELEASE: ${{ steps.check.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          COMMIT_TITLE=$(git log -1 --pretty=format:"%s")

          PRERELEASE_FLAG=""
          [[ "${IS_PRERELEASE}" == "true" ]] && PRERELEASE_FLAG="--prerelease"

          # 已存在同名 release 时跳过，避免 workflow 重跑报错
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi

          gh release create "${TAG}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "${TAG} - ${COMMIT_TITLE}" \
            --generate-notes \
            ${PRERELEASE_FLAG}

          echo "Draft release created for ${TAG}"

      # 把静默失败变成显式失败：否则要等用户反馈"收不到更新"才发现
      - name: Verify tag exists
        if: steps.check.outputs.compare_result == 'success'
        run: |
          set -euo pipefail
          TAG="v${{ steps.check.outputs.version }}"
          if ! git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "::error::Tag ${TAG} was not created — 用户将收不到更新"
            exit 1
          fi
          echo "Tag ${TAG} exists"
